version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: out/devdocs.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: git   # 自建/无上游镜像：版本由本仓库 tag 决定

build:
  run_buildscript: false

images: []

stores:
  official:
    enabled: true
    create_if_missing: true
    continue_if_newer_version: true
    skip_if_version_exists: false
    retry:
      enabled: true
      max_attempts: 4
      initial_delay: 5s
      max_delay: 60s
      max_upload_timeout: 600s
    application:
      language: zh
      brief: "离线 API 文档库"
      description: "DevDocs 把上百种开发文档聚合到一个界面，支持离线浏览与全文搜索，查 API 不再来回切标签页。"
      keywords: "文档, API, 离线, 开发, 搜索"
      support_pc: true
      screenshot_pc_files:
        - ".github/screenshots/pc-1.png"
        - ".github/screenshots/pc-2.png"
        - ".github/screenshots/pc-3.png"
  private:
    enabled: false
